name: Create release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate tag and stable source version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $props = [xml](Get-Content Version.props)
          $version = $props.Project.PropertyGroup[0].VersionPrefix

          if ($tag -ne "v$version") {
            throw "Tag $tag neodpovídá VersionPrefix $version."
          }

          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tag musí ukazovat na commit obsažený ve větvi main."
          }

          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: |
          dotnet tool restore --configfile NuGet.Config
          dotnet restore WorkScout.slnx --configfile NuGet.Config
          dotnet restore WorkScout_app.csproj -r win-x64 --configfile NuGet.Config

      - name: Build and test stable version
        run: |
          dotnet build WorkScout.slnx -c Release --no-restore -p:BuildChannel=stable
          dotnet test WorkScout.slnx -c Release --no-restore --no-build -p:BuildChannel=stable

      - name: Publish win-x64
        run: dotnet publish WorkScout_app.csproj -c Release -r win-x64 --self-contained false --no-restore -p:BuildChannel=stable -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/WorkScout-${{ env.VERSION }}-win-x64

      - name: Create archive and checksum
        shell: pwsh
        run: |
          $releaseDir = "artifacts/WorkScout-$env:VERSION-win-x64"
          $archive = "artifacts/WorkScout-$env:VERSION-win-x64.zip"
          Remove-Item "$releaseDir/*.pdb" -ErrorAction SilentlyContinue
          Copy-Item README.md, CHANGELOG.md -Destination $releaseDir
          Compress-Archive "$releaseDir/*" $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          "$hash  WorkScout-$env:VERSION-win-x64.zip" | Set-Content artifacts/SHA256.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "artifacts/WorkScout-${{ env.VERSION }}-win-x64.zip" artifacts/SHA256.txt --verify-tag --title "WorkScout ${{ env.VERSION }}" --notes-file "docs/releases/v${{ env.VERSION }}.md"
